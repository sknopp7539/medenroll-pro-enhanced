        function restoreNotes() {
            const statusDiv = document.getElementById('status');
            
            try {
                // Get existing providers from localStorage
                const existingData = localStorage.getItem('medenroll_providers');
                if (!existingData) {
                    statusDiv.innerHTML = '<div class="error status">❌ Error: No provider data found. Please open this page from https://medenrollpro-ccmhbo8h.manus.space/restore-notes.html</div>';
                    return;
                }
                
                const providers = JSON.parse(existingData);
                let restoredCount = 0;
                
                // Restore notes
                NOTES_BACKUP.forEach(noteEntry => {
                    const provider = providers.find(p => p.name === noteEntry.provider);
                    if (provider) {
                        const enrollment = provider.payerEnrollments.find(pe => pe.payerName === noteEntry.payer);
                        if (enrollment) {
                            enrollment.notes = noteEntry.notes;
                            restoredCount++;
                        }
                    }
                });
                
                // Save back
                localStorage.setItem('medenroll_providers', JSON.stringify(providers));
                
                statusDiv.innerHTML = `
                    <div class="success status">
                        ✅ Success! Restored ${restoredCount} of 216 notes.<br><br>
                        <strong>Next:</strong> Click "Open MedEnroll Pro" and refresh to see your notes.
                    </div>
                `;
                
            } catch (error) {
                statusDiv.innerHTML = `<div class="error status">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
